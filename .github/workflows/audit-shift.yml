name: Audit Log S3 Shift

# Optional: archives the audit chain to S3 Object Lock for WORM preservation.
# Disabled unless AWS_AUDIT_BUCKET secret is set.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  shift:
    name: Shift Audit Log to S3 Object Lock
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check if S3 archival is configured
        id: gate
        env:
          BUCKET: ${{ secrets.AWS_AUDIT_BUCKET }}
        run: |
          if [[ -z "${BUCKET:-}" ]]; then
            echo "AWS_AUDIT_BUCKET not configured — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_AUDIT_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-2' }}

      - name: Set up Python
        if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify chain before shift
        if: steps.gate.outputs.skip == 'false'
        run: |
          if [[ -f .audit/events.jsonl ]]; then
            bash .claude/bin/audit-verify.sh
          else
            echo "No audit log yet — nothing to shift."
          fi

      - name: Shift to S3
        if: steps.gate.outputs.skip == 'false'
        env:
          AWS_AUDIT_BUCKET: ${{ secrets.AWS_AUDIT_BUCKET }}
          AWS_AUDIT_ROLE_ARN: ${{ secrets.AWS_AUDIT_ROLE_ARN }}
        run: bash .claude/bin/audit-shift.sh

      - name: Monthly attestation (first day of month)
        if: steps.gate.outputs.skip == 'false'
        run: bash .claude/bin/audit-attest.sh --monthly || true
