name: 🚀 Project Brief (한 문장으로 시작)
description: 한 문장으로 프로젝트를 시작합니다. PM 코디네이터가 로드맵을 자동 생성한 뒤 사용자 승인을 받습니다.
title: "[START] "
labels: ["gate:brief"]
body:
  - type: markdown
    attributes:
      value: |
        ## 한 문장으로 프로젝트 시작

        만들고 싶은 것을 한 문장으로 적어주세요. 잠시 후 같은 이슈에 로드맵 초안이 댓글로 달립니다.

        그러면 다음 중 하나로 답변하세요:
        - `/yes` — 로드맵 그대로 진행
        - `/edit 마일스톤 2를 빼고 인증을 추가해줘` — 수정 요청
        - `/no` — 취소

  - type: textarea
    id: brief
    attributes:
      label: 한 문장 (브리프)
      description: 만들고 싶은 것을 자유롭게 한 문장으로
      placeholder: "친구랑 같이 하는 빙수 빨리먹기 게임 만들고 싶어"
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 대략 규모
      description: PM 코디네이터가 이걸 기준으로 마일스톤 수를 정합니다
      options:
        - 작음 (1-2 마일스톤, 며칠)
        - 중간 (3-4 마일스톤, 1-2주)
        - 큼 (5+ 마일스톤, 수주)
      default: 1
    validations:
      required: true

  - type: input
    id: constraints
    attributes:
      label: 제약사항 (선택)
      description: 기술 스택 고정·예산·기한 등
      placeholder: "Next.js + Supabase, 무료 티어로만"
    validations:
      required: false
