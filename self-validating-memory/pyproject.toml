[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "svmp"
version = "0.1.0"
description = "Self-Validating Memory-Plasticity learning system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["svmp*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
